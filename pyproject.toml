[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "presidio-redactor"
version = "0.2.0"
description = "Local command-line tool to redact PII and DevOps secrets from text files and images, built on Microsoft Presidio."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Munish Mehta" }]
keywords = ["presidio", "redaction", "pii", "secrets", "devops", "ocr"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "presidio-analyzer==2.2.364",
    "presidio-anonymizer==2.2.364",
    "presidio-image-redactor==0.0.60",
    "pillow",
    "pytesseract",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
]

[project.scripts]
redact = "presidio_redactor.cli:main"

[project.urls]
Homepage = "https://github.com/mumehta/local-redact"
Repository = "https://github.com/mumehta/local-redact"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
